name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-smoke:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            backend-core/package-lock.json
            client-extension/package-lock.json
            b2b-sdk/package-lock.json

      - name: Backend — install, typecheck, build
        run: |
          cd backend-core
          npm ci
          npm run typecheck
          npm run build

      - name: Extension — install, build
        run: |
          cd client-extension
          npm ci
          npm run build

      - name: SDK — install, build
        run: |
          cd b2b-sdk
          npm ci
          npm run build

      - name: Smoke test against local backend
        run: |
          cd backend-core
          PORT=3101 OMNI_DB_PATH=/tmp/ci-ledger.db node dist/server.js &
          SERVER_PID=$!

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3101/health > /dev/null; then
              echo "Backend healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "Backend did not become healthy within 30s"
              kill "$SERVER_PID" 2>/dev/null || true
              exit 1
            fi
            sleep 1
          done

          SMOKE_URL=http://localhost:3101 npm run smoke
          EXIT_CODE=$?
          kill "$SERVER_PID" 2>/dev/null || true
          exit $EXIT_CODE
