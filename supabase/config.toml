# OmniPiggy — local / linked Supabase project config (placeholders only).
# Do NOT put secrets here. Link with: supabase link --project-ref <PROJECT_REF>

project_id = "omni-piggy-local"

# Ports offset from default 5432x so Omni can run beside another local Supabase project.
[api]
enabled = true
port = 55321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.pooler]
enabled = false

[studio]
enabled = true
port = 55323

[inbucket]
enabled = true
port = 55324

[storage]
enabled = true

[analytics]
enabled = true
port = 55327

[auth]
enabled = true
site_url = "http://localhost:3001"
additional_redirect_urls = [
  "http://localhost:3001",
  "http://localhost:3001/ads/login",
  "http://localhost:5174",
  "http://localhost:5174/ads/login",
]
enable_signup = true

# Anonymous sign-in may be used later for extension installations before account
# linking. Enable in the dashboard / auth config when ready; keep RLS tight.
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = false
